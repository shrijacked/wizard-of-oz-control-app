<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Robot Operator Screen</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="display-page audit-display robot-display">
    <div id="connection-badge" class="connection-badge" hidden>Reconnecting…</div>
    <main class="display-shell hint-only-layout">
      <section class="display-card">
        <p class="display-kicker">Robot Operator Screen</p>
        <h1>Move this piece</h1>
        <div class="display-alert-controls">
          <button id="robot-sound-toggle" class="button button-primary" type="button">Enable alert sound</button>
          <small id="robot-sound-status" class="display-meta">Tap once on this screen so new robot cues play a beep.</small>
        </div>
        <p id="robot-action" class="display-message" aria-live="assertive">No robot cue has been sent yet.</p>
        <small id="robot-updated" class="display-meta">Awaiting admin input.</small>
        <ol id="robot-history" class="cue-history"></ol>
      </section>
    </main>

    <script type="module" src="/robot.js"></script>
  </body>
</html>
