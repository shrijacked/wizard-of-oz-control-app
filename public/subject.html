<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Participant Hint Display</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="display-page subject-display">
    <div id="connection-badge" class="connection-badge" hidden>Reconnecting…</div>
    <main class="display-shell hint-only-layout">
      <section class="display-card subject-hint-card">
        <p class="display-kicker">Participant Display</p>
        <h1>Hint</h1>
        <div class="display-alert-controls">
          <button id="subject-sound-toggle" class="button button-primary" type="button">Enable alert sound</button>
          <small id="subject-sound-status" class="display-meta">Tap once on this screen so new hints play a beep.</small>
        </div>
        <p id="subject-hint" class="display-message" aria-live="assertive">Waiting for a hint from the researcher.</p>
        <small id="subject-updated" class="display-meta">No broadcast received yet.</small>
      </section>
    </main>

    <script type="module" src="/subject.js"></script>
  </body>
</html>
